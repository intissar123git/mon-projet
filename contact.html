<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactez-nous / Inscrivez-vous</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="entete">
        <h1>Contactez-nous / Inscrivez-vous</h1>
    </header>

    <nav class="navigation">
        <a href="index.html">Accueil</a>
        <a href="apropos.html">À propos</a>
        <a href="services.html">Services</a>
        <a href="produits.html">Produits / Offres</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>
        <form action="#" method="post" enctype="multipart/form-data">
            
            <!-- GROUPE 1 -->
            <fieldset>
                <legend>1- Vos coordonnées</legend>

                <label for="nom">Nom* :</label>
                <input type="text" id="nom" name="nom" required autofocus maxlength="50" placeholder="Votre nom"><br><br>

                <label for="prenom">Prénom* :</label>
                <input type="text" id="prenom" name="prenom" required maxlength="50" placeholder="Votre prénom"><br><br>

                <label for="ddn">Date de naissance :</label>
                <input type="date" id="ddn" name="ddn"><br><br>

                <label for="email">Adresse email* :</label>
                <input type="email" id="email" name="email" required placeholder="exemple@email.com"><br><br>

                <label for="site">Site web :</label>
                <input type="url" id="site" name="site" value="http//:www." placeholder="https://monsite.com"><br><br>

                <label for="secret">Code secret :</label>
                <input type="password" id="secret" name="secret" minlength="6" maxlength="20"><br><br>

                <span>Genre :</span>
                <input type="radio" id="homme" name="genre" value="Homme" checked>
                <label for="homme">Homme</label>
                <input type="radio" id="femme" name="genre" value="Femme">
                <label for="femme">Femme</label><br><br>

                <label for="pays">Pays :</label>
                <select id="pays" name="pays">
                    <option value="Tunisie">Tunisie</option>
                    <option value="France">France</option>
                    <option value="Algérie">Algérie</option>
                    <option value="Maroc">Maroc</option>
                    <option value="Autre">Autre</option>
                </select><br><br>

                <label for="tel">Téléphone :</label>
                <input type="tel" id="tel" name="tel" pattern="[0-9]{8}" placeholder="12345678">
            </fieldset>

            <!-- GROUPE 2 -->
            <fieldset>
                <legend>2- Informations complémentaires</legend>

                <label for="adresse">Adresse postale :</label>
                <input type="text" id="adresse" name="adresse" placeholder="Votre adresse"><br><br>

                <label for="cp">Code postal :</label>
                <input type="text" id="cp" name="cp" value="1000" maxlength="4"><br><br>

                <label for="semestre">Semestre :</label>
                <select id="semestre" name="semestre">
                    <option value="S1">S1</option>
                    <option value="S2">S2</option>
                    <option value="S3">S3</option>
                    <option value="S4">S4</option>
                </select><br><br>

                <label for="region">Région préférée :</label>
                <select id="region" name="region">
                    <option value="Tunis">Tunis</option>
                    <option value="Sousse">Sousse</option>
                    <option value="Sfax">Sfax</option>
                    <option value="Djerba">Djerba</option>
                    <option value="Tozeur">Tozeur</option>
                </select>
            </fieldset>

            <!-- GROUPE 3 -->
            <fieldset>
                <legend>3- Goûts et centres d'intérêt</legend>

                <span>Centres d'intérêt :</span><br>
                <input type="checkbox" id="culture" name="interet[]" value="Culture" checked>
                <label for="culture">Culture</label>

                <input type="checkbox" id="gastronomie" name="interet[]" value="Gastronomie">
                <label for="gastronomie">Gastronomie</label>

                <input type="checkbox" id="plage" name="interet[]" value="Plage">
                <label for="plage">Plage</label>

                <input type="checkbox" id="desert" name="interet[]" value="Désert">
                <label for="desert">Désert</label>

                <input type="checkbox" id="histoire" name="interet[]" value="Histoire">
                <label for="histoire">Histoire</label><br><br>

                <label for="niveau">Niveau en HTML :</label>
                <input type="range" id="niveau" name="niveau" min="0" max="100" step="10"><br><br>

                <label for="note">Note de satisfaction :</label>
                <input type="number" id="note" name="note" min="1" max="10" step="1"><br><br>

                <label for="message">Message / Commentaire :</label><br>
                <textarea id="message" name="message" rows="5" cols="40" placeholder="Écrivez votre message ou commentaire ici..."></textarea>
            </fieldset>

            <!-- GROUPE 4 -->
            <fieldset>
                <legend>4- Photo</legend>

                <label for="photo">Photo de profil :</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </fieldset>

            <br>
            <input type="submit" value="Envoyer">
            <input type="reset" value="Effacer">
        </form>

        <p><a href="index.html">Retour à l'accueil</a></p>
    </main>

    <footer>
        <p>&copy; 2026 MonProjet - Tous droits réservés.</p>
    </footer>

</body>
</html>
